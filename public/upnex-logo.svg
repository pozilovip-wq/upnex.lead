<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background -->
  <rect width="200" height="200" rx="24" fill="#0d2461"/>

  <!-- U: white right stem -->
  <rect x="76" y="52" width="28" height="100" fill="white"/>

  <!-- U: bowl outer shape -->
  <path d="M 18,152 C 18,190 104,190 104,152 Z" fill="white"/>

  <!-- U: bowl inner cutout (gap continuation, painted in bg color) -->
  <path d="M 52,152 C 52,165 76,165 76,152 Z" fill="#0d2461"/>

  <!-- Red arrow shaft (left stem of U) -->
  <rect x="18" y="52" width="34" height="100" fill="#e8192c"/>

  <!-- Red arrowhead -->
  <polygon points="4,58 35,14 66,58" fill="#e8192c"/>

  <!-- P: vertical bar -->
  <rect x="110" y="52" width="22" height="106" fill="white"/>

  <!-- P: D-arc outer (half-circle sweeping right, closes with vertical Z line) -->
  <path d="M 132,52 A 53,53 0 0,1 132,158 Z" fill="white"/>

  <!-- P: D-arc inner cutout (ring, painted in bg color) -->
  <path d="M 132,74 A 31,31 0 0,1 132,136 Z" fill="#0d2461"/>
</svg>
